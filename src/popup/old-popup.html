<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TWP</title>
  <link rel="stylesheet" href="/lib/ui-theme.css">
  <link rel="stylesheet" href="old-popup.css">
</head>
<body>
  <main>
    <div class="toolbar">
      <div class="language-tabs" role="tablist" aria-label="Translation" data-i18n-aria-label="msgTranslations">
        <button id="btnRestore" class="language-tab" role="tab" aria-selected="true" data-i18n="nativeDetectedLanguage">Detected language</button>
        <button id="btnTranslate" class="language-tab" role="tab" aria-selected="false" tabindex="-1"></button>
      </div>
      <button id="btnMenu" class="icon-button" aria-expanded="false" aria-controls="popupMenu" aria-label="Options" data-i18n-aria-label="btnOptions" title="Options" data-i18n-title="btnOptions">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
      <button id="btnClose" class="icon-button" aria-label="Close" data-i18n-aria-label="nativeClose" title="Close" data-i18n-title="nativeClose">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="statusRegion" class="status-region" hidden>
      <span id="popupStatus" role="status" aria-live="polite"></span>
      <button id="btnTryAgain" class="text-button" data-i18n="btnTryAgain" hidden>Try again</button>
    </div>
    <section id="languagePicker" class="language-picker" hidden>
      <label for="selectTargetLanguage" data-i18n="msgChooseAnotherLanguage">Choose another language</label>
      <select id="selectTargetLanguage">
        <optgroup name="recents" label="Recent" data-i18n-label="msgRecents"></optgroup>
        <optgroup name="all" label="All" data-i18n-label="msgAll"></optgroup>
      </select>
      <div class="picker-actions"><button id="btnReset" class="text-button" data-i18n="nativeCancel">Cancel</button><button id="btnApplyLanguage" class="filled-button" data-i18n="btnTranslate">Translate</button></div>
    </section>
    <section id="popupMenu" class="popup-menu" aria-label="Options" data-i18n-aria-label="btnOptions" hidden>
      <label class="menu-check" id="divAlwaysTranslateThisLang"><input id="cbAlwaysTranslateThisLang" type="checkbox"><span id="lblAlwaysTranslateThisLang"></span></label>
      <div id="menuActions"></div>
      <div class="menu-secondary">
        <button id="btnImproveTranslation" data-i18n="msgImproveTranslation">Improve translation</button>
        <button id="btnSwitchInterfaces" data-i18n="nativeDetailedInterface">Detailed interface</button>
      </div>
    </section>
    <footer><span id="serviceName">Google Translate</span><button id="btnService" class="text-button" data-i18n="swapTranslationService" hidden>Switch translation service</button></footer>
  </main>
  <select id="btnOptions" hidden aria-hidden="true" tabindex="-1">
            <option value="options" selected disabled hidden>Options</option>
            <option value="changeLanguage" data-i18n="msgChooseAnotherLanguage">
              Choose another language
            </option>
            <option value="alwaysTranslateThisSite" data-i18n="btnAlwaysTranslate">
              Always translate this site
            </option>
            <option value="neverTranslateThisSite" data-i18n="btnNeverTranslate">
              Never translate this site
            </option>
            <option value="neverTranslateThisLanguage" data-i18n="btnNeverTranslateThisLanguage" style="display: none">
              Never translate this language
            </option>
            <optgroup label=""></optgroup>
            <option data-i18n="lblShowTranslateSelectedButton" value="showTranslateSelectedButton">
              Show the button to translate the selected text
            </option>
            <option data-i18n="lblShowOriginalTextWhenHovering" value="showOriginalTextWhenHovering">
              Show original text when hovering
            </option>
            <option data-i18n="lblShowTranslatedWhenHoveringThisSite" value="showTranslatedWhenHoveringThisSite">
              Show translation when hovering over this site
            </option>
            <option data-i18n="lblShowTranslatedWhenHoveringThisLang" data-i18n-ph-value=""
              value="showTranslatedWhenHoveringThisLang" hidden>
              Show translation when hovering over websites in
            </option>
            <optgroup label=""></optgroup>
            <option value="translateInExternalSite" data-i18n="btnOpenOnGoogleTranslate">
              Open in Google Translate
            </option>
            <option value="moreOptions" data-i18n="btnMoreOptions">
              More options
            </option>
            <option value="translatePDF" data-i18n="msgTranslatePDF">Translate PDF</option>
            <option value="donate" data-i18n="btnDonate">Donate</option>
          </select>
  <script src="/lib/polyfill.js"></script>
  <script src="/lib/checkedLastError.js"></script>
  <script src="/lib/stuff.js"></script>
  <script src="detect-pdf.js"></script>
  <script src="/lib/languages.js"></script>
  <script src="/lib/config.js"></script>
  <script src="/lib/i18n.js"></script>
  <script src="old-popup.js"></script>
</body>
</html>
