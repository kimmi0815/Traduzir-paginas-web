<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TWP — ページ内パネルの試作</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #dce5eb; color: #202124; font: 15px/1.8 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    article { max-width: 740px; padding: 140px 28px 60px; margin: auto; }
    h1 { font-size: 26px; font-weight: 600; }
    p { color: #4e5964; }
    button { font: inherit; cursor: pointer; }
    #openPanel { border: 1px solid #a9b5c0; background: white; color: #1967d2; border-radius: 8px; padding: 8px 14px; }
    button:focus-visible { outline: 2px solid #1967d2; outline-offset: 3px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <article>
    <h1>ページ内に描くと、外枠まで丸くできます。</h1>
    <p>右上は拡張機能と同じページ内パネルです。角の外にはページの背景が見え、影も丸みに沿います。</p>
    <p>言語タブを押すと青いバーが移動します。メニュー、閉じるボタン、Escape、パネル外のクリックも試せます。</p>
    <button id="openPanel">翻訳パネルを開く／閉じる</button>
    <p>翻訳APIはモックです。実際のページ翻訳やインストール済み拡張機能の設定変更は行いません。</p>
  </article>
  <script src="/lib/polyfill.js"></script>
  <script src="/lib/checkedLastError.js"></script>
  <script src="/lib/languages.js"></script>
  <script src="/lib/config.js"></script>
  <script src="/lib/platformInfo.js"></script>
  <script src="/lib/i18n.js"></script>
  <script src="/popup/old-popup.js"></script>
  <script src="/contentScript/desktopPopup.js"></script>
  <script src="/rounded-popup.js"></script>
</body>
</html>
