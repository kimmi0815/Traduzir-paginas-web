<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TWP · Native UI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#202124;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1100px;margin:auto;padding:48px 32px}header{margin-bottom:36px}.eyebrow{font-size:11px;letter-spacing:.12em;color:#5f6368}h1{font-size:26px;font-weight:550;letter-spacing:-.5px;margin:8px 0}p{color:#5f6368;margin:0}h2{font-size:15px;font-weight:550;margin:0 0 8px}.popup-study{display:grid;grid-template-columns:1fr 420px;align-items:start;gap:36px;padding:32px 0 48px;border-bottom:1px solid #dadce0}.shell{width:280px;border:1px solid #dadce0;border-radius:16px;box-shadow:0 4px 8px #0001,0 14px 36px #0001;overflow:hidden;background:#fff;margin:auto}.shell iframe{display:block;width:280px;height:92px;border:0}.states{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}button{border:1px solid #dadce0;border-radius:8px;padding:9px 14px;background:#fff;font:inherit;color:#5f6368;cursor:pointer;min-height:40px}button[aria-pressed=true]{color:#1967d2;background:#e8f0fe;border-color:#a8c7fa}button:focus-visible,a:focus-visible{outline:2px solid #1967d2;outline-offset:3px}.settings{padding-top:32px}.settings-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.settings a{color:#1967d2;text-decoration:none}.settings iframe{width:100%;height:820px;border:1px solid #dadce0;border-radius:12px;background:#fff}.note{font-size:12px;margin-top:24px}@media(max-width:800px){main{padding:28px 16px}.popup-study{grid-template-columns:1fr;gap:30px}.settings iframe{height:760px}.shell{max-width:100%}}
</style></head>
<body><main><header><span class="eyebrow">TWP / NATIVE UI</span><h1>翻訳を、ブラウザの一部に。</h1><p>Chromeの翻訳UIを参照したコンパクトなポップアップと、統一した設定画面。</p></header>
<section class="popup-study"><div><h2>ポップアップ</h2><p>言語タブで翻訳と原文を切り替え。<br>自動翻訳や言語変更は「⋮」から開けます。</p><div class="states" aria-label="表示状態"><button data-state="original" aria-pressed="true">原文</button><button data-state="translated" aria-pressed="false">翻訳済み</button><button data-state="error" aria-pressed="false">エラー</button><button id="theme" aria-pressed="false">ダーク</button></div></div><div class="shell"><iframe id="popup" title="ポップアップの実装プレビュー" src="/popup/old-popup.html?target=ja&service=google&source=und&theme=light"></iframe></div></section>
<section class="settings"><div class="settings-heading"><h2>設定</h2><a href="/options/options.html?theme=light&target=ja" target="_blank">別のタブで開く ↗</a></div><iframe title="設定画面の実装プレビュー" src="/options/options.html?theme=light&target=ja"></iframe></section>
<p class="note">拡張機能本体と同じHTML・CSS・JavaScriptを表示しています。検証用APIに接続しているため、実際のページ翻訳やインストール済み拡張機能の設定変更は行いません。</p></main><script src="/preview.js"></script></body></html>
