<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TWP Fast · UI design study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeefef;color:#232629;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1240px;margin:0 auto;padding:56px 36px}header{margin-bottom:40px}.eyebrow{font-size:11px;font-weight:650;letter-spacing:.16em;color:#6b7075}h1{font-size:28px;letter-spacing:-.035em;font-weight:600;margin:10px 0}header p{color:#666d72;margin:0;max-width:640px}.studies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.study{min-width:0}.caption{display:flex;gap:10px;align-items:center;margin-bottom:18px}.number{color:#878c90;font-size:12px}.caption h2{font-size:14px;font-weight:600;margin:0}.description{color:#676d72;font-size:12px;margin:18px 4px 0}.popup{--bg:#fff;--fg:#25282c;--muted:#6f757c;--line:#e9eaec;--soft:#f5f6f7;--accent:#2861df;--on-accent:#fff;background:var(--bg);color:var(--fg);border-radius:16px;box-shadow:0 2px 5px #00000006,0 14px 34px #0000000d;overflow:hidden;border:1px solid #0000000c}.dark{--bg:#202124;--fg:#eeeef0;--muted:#a1a2aa;--line:#35363b;--soft:#2b2c31;--accent:#b9b2ff;--on-accent:#222033;border-color:#ffffff15;border-radius:12px}.soft{--bg:#fcfdf9;--fg:#293c33;--muted:#707d72;--line:#e6eae1;--soft:#f0f3e9;--accent:#426d50;--on-accent:#fff;border-radius:22px}.top{padding:18px 20px 12px;display:flex;align-items:center;gap:8px}.brand{font-weight:650;font-size:14px;letter-spacing:-.03em}.fast{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}.top svg{width:21px;height:21px;margin-right:1px;color:var(--accent)}.site{padding:0 20px;color:var(--muted);font-size:12px}.content{padding:18px 20px 20px}.languages{display:grid;grid-template-columns:1fr 20px 1fr;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:13px 12px}.soft .languages{border-radius:14px}.language-label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.language{font-size:15px;font-weight:500}.direction{color:var(--muted)}select{font:inherit;background:transparent;color:var(--fg);border:0;width:100%;min-height:28px;padding:0;cursor:pointer}option{background:var(--bg);color:var(--fg)}button{font:inherit;cursor:pointer}.primary{width:100%;min-height:42px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:600;margin:16px 0 5px;transition:background-color .12s,opacity .12s}.soft .primary{border-radius:12px}.primary:hover{opacity:.88}.state{height:25px;text-align:center;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;gap:7px}.state kbd{font:10px inherit;border:1px solid var(--line);border-radius:4px;padding:0 4px}.rules{margin-top:15px;border-top:1px solid var(--line);padding-top:9px}.rule{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font-size:12px;cursor:pointer}.rule input{appearance:none;flex-shrink:0;width:30px;height:18px;background:var(--line);border-radius:20px;position:relative;margin:0;cursor:pointer}.rule input:before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0002}.rule input:checked{background:var(--accent)}.rule input:checked:before{left:14px}.footer{border-top:1px solid var(--line);padding:8px 15px;display:flex;align-items:center;justify-content:space-between}.footer select{font-size:11px;max-width:104px;min-height:40px;color:var(--muted)}.quiet{background:transparent;color:var(--muted);border:0;min-height:40px;padding:0 6px;font-size:11px}.quiet:hover{color:var(--fg)}details{border-top:1px solid var(--line);padding:0 20px}summary{font-size:12px;min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:var(--muted)}summary:after{content:'＋'}details[open] summary:after{content:'−'}details .rule{font-size:11px}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.note{margin-top:36px;font-size:11px;color:#747b80;border-top:1px solid #d9dddf;padding-top:18px}@media(max-width:950px){.studies{grid-template-columns:1fr;max-width:380px;margin:0 auto;gap:32px}main{padding:32px 20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main>
<header><div class="eyebrow">TWP FAST / DESIGN STUDY 01</div><h1>いつもの翻訳を、すっきりと。</h1><p>言語と翻訳操作を中心に、自動翻訳の設定をひとまとまりに。<br>同じ構成で、3つの見た目を比較できます。</p></header>
<div class="studies" id="studies"></div>
<p class="note">UI検討用の独立した見本です。言語選択・翻訳表示の切り替え・スイッチ・詳細の開閉を試せます。実際のページ翻訳や設定保存には接続していません。サイト名と言語はサンプルです。</p>
</main>
<template id="study">
<section class="study"><div class="caption"><span class="number"></span><h2></h2></div><article class="popup">
<div class="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 5h11M8.5 2v3M5 5c1 5 4 8 8 10M12 5c-1 5-4 8-9 11M13 21l4-11 4 11M14.5 17h5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand">TWP</span><span class="fast">FAST</span></div>
<div class="site">en.wikipedia.org</div><div class="content">
<div class="languages"><div><span class="language-label">検出した言語</span><span class="language">英語</span></div><span class="direction" aria-hidden="true">→</span><label><span class="language-label">翻訳先</span><select class="target" aria-label="翻訳先の言語"><option>日本語</option><option>英語</option><option>ウクライナ語</option><option>ドイツ語</option></select></label></div>
<button class="primary" type="button">日本語に翻訳</button><div class="state" aria-live="polite">ページ全体を翻訳</div>
<div class="rules"><label class="rule"><span>英語を常に翻訳</span><input type="checkbox" role="switch"></label><label class="rule"><span>このサイトを常に翻訳</span><input type="checkbox" role="switch"></label></div></div>
<details><summary>詳細オプション</summary><label class="rule"><span>マウスを重ねて原文を表示</span><input type="checkbox" role="switch" checked></label><label class="rule"><span>選択したテキストの翻訳ボタン</span><input type="checkbox" role="switch" checked></label></details>
<div class="footer"><select aria-label="翻訳サービス"><option>Google 翻訳</option><option>Bing 翻訳</option><option>Yandex 翻訳</option></select><button class="quiet" type="button">原文を表示</button></div>
</article><p class="description"></p></section>
</template>
<script>
const variants=[['01','Native / すっきり','', '白とグレー、控えめな青。ブラウザに自然になじむ方向。'],['02','Precision / 精密','dark','チャコールと淡い紫。密度を保ち、輪郭と文字を明確に。'],['03','Soft / やわらかく','soft','温かみのある白とセージ。丸みを少し強く、穏やかな印象に。']];
for(const [number,title,theme,description] of variants){const view=document.querySelector('#study').content.cloneNode(true);view.querySelector('.number').textContent=number;view.querySelector('h2').textContent=title;view.querySelector('.popup').classList.add(theme||'native');view.querySelector('.description').textContent=description;const popup=view.querySelector('.popup'),primary=popup.querySelector('.primary'),target=popup.querySelector('.target'),state=popup.querySelector('.state');let translated=false;function render(){primary.textContent=translated?'原文に戻す':target.value+'に翻訳';state.textContent=translated?target.value+'で表示中（見本）':'ページ全体を翻訳';}primary.addEventListener('click',()=>{translated=!translated;render()});target.addEventListener('change',()=>{translated=false;render()});popup.querySelector('.quiet').addEventListener('click',()=>{translated=false;render()});document.querySelector('#studies').append(view);}
</script>
</html>
